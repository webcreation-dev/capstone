 </head>
 <body class="antialiased flex h-full text-base text-foreground bg-background">
  <!-- Theme Mode -->
  <script>
   const defaultThemeMode = 'light'; // light|dark|system
			let themeMode;

			if (document.documentElement) {
				if (localStorage.getItem('kt-theme')) {
					themeMode = localStorage.getItem('kt-theme');
				} else if (
					document.documentElement.hasAttribute('data-kt-theme-mode')
				) {
					themeMode =
						document.documentElement.getAttribute('data-kt-theme-mode');
				} else {
					themeMode = defaultThemeMode;
				}

				if (themeMode === 'system') {
					themeMode = window.matchMedia('(prefers-color-scheme: dark)').matches
						? 'dark'
						: 'light';
				}

				document.documentElement.classList.add(themeMode);
			}
  </script>
  <!-- End of Theme Mode -->
  <!-- Page -->
  <style>
   .page-bg {
			background-image: url('assets/media/images/2600x1200/bg-10.png');
		}
		.dark .page-bg {
			background-image: url('assets/media/images/2600x1200/bg-10-dark.png');
		}
  </style>
  <div class="flex items-center justify-center grow bg-center bg-no-repeat page-bg">
   <div class="kt-card max-w-[370px] w-full">
    <form action="#" class="kt-card-content flex flex-col gap-5 p-10" id="sign_up_form" method="post">
     <div class="text-center mb-2.5">
      <h3 class="text-lg font-medium text-mono leading-none mb-2.5">
       Inscription Consultant
      </h3>
      <div class="flex items-center justify-center">
       <span class="text-sm text-secondary-foreground me-1.5">
        Déjà un compte ?
       </span>
       <a class="text-sm link" href="html/demo1/consultant-login.html">
        Se connecter
       </a>
      </div>
     </div>
     <div class="flex flex-col gap-1">
      <label class="kt-form-label text-mono">
       Nom du Cabinet / Raison Sociale
      </label>
      <input class="kt-input" name="company_name" placeholder="Ex: AfricAudit SARL" type="text" value=""/>
     </div>
     <div class="flex flex-col gap-1">
      <label class="kt-form-label text-mono">
       Adresse E-mail professionnelle
      </label>
      <input class="kt-input" name="user_email" placeholder="contact@cabinet.com" type="email" value=""/>
     </div>
     <div class="flex flex-col gap-1">
      <label class="kt-form-label font-normal text-mono">Mot de passe</label>
      <div class="kt-input" data-kt-toggle-password="true">
       <input name="user_password" placeholder="Créer un mot de passe" type="password" value=""/>
       <button class="kt-btn kt-btn-sm kt-btn-ghost kt-btn-icon bg-transparent! -me-1.5" data-kt-toggle-password-trigger="true" type="button">
        <span class="kt-toggle-password-active:hidden">
         <i class="ki-filled ki-eye text-muted-foreground">
         </i>
        </span>
        <span class="hidden kt-toggle-password-active:block">
         <i class="ki-filled ki-eye-slash text-muted-foreground">
         </i>
        </span>
       </button>
      </div>
     </div>
     <div class="flex flex-col gap-1">
      <label class="kt-form-label font-normal text-mono">
       Confirmer le mot de passe
      </label>
      <div class="kt-input" data-kt-toggle-password="true">
       <input name="user_password_confirm" placeholder="Confirmer le mot de passe" type="password" value=""/>
       <button class="kt-btn kt-btn-sm kt-btn-ghost kt-btn-icon bg-transparent! -me-1.5" data-kt-toggle-password-trigger="true" type="button">
        <span class="kt-toggle-password-active:hidden">
         <i class="ki-filled ki-eye text-muted-foreground">
         </i>
        </span>
        <span class="hidden kt-toggle-password-active:block">
         <i class="ki-filled ki-eye-slash text-muted-foreground">
         </i>
        </span>
       </button>
      </div>
     </div>
     <label class="kt-checkbox-group">
      <input class="kt-checkbox kt-checkbox-sm" name="check" type="checkbox" value="1"/>
      <span class="kt-checkbox-label">J'accepte les <a class="text-sm link" href="#">Conditions Générales</a></span>
     </label>
     <button class="kt-btn kt-btn-primary flex justify-center grow">
      Créer mon compte
     </button>
    </form>
   </div>
  </div>
  <!-- End of Page -->
